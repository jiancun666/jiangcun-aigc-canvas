server:
  port: 8082

spring:
  application:
    name: semple-aigc-canvas-auth
  config:
    import:
      - optional:nacos:semple-aigc-canvas-auth.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:10.1.3.34:8848}
        namespace: ${NACOS_NAMESPACE:aigc_canvas}
#        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
#        namespace: ${NACOS_NAMESPACE:aigc_canvas}
        group: ${NACOS_GROUP:SEMPLE_AIGC_CANVAS_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:Yml8866.}
      config:
        server-addr: ${NACOS_SERVER_ADDR:10.1.3.34:8848}
        namespace: ${NACOS_NAMESPACE:aigc_canvas}
#        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
#        namespace: ${NACOS_NAMESPACE:aigc_canvas}
        group: ${NACOS_GROUP:SEMPLE_AIGC_CANVAS_GROUP}
        file-extension: yml
        refresh-enabled: true
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:Yml8866.}
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/semple_aigc_canvas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.semple.aigc.canvas.api.system.domain
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 0
      logic-not-delete-value: 1

semple-aigc-canvas:
  mybatis-plus:
    sql-log-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

